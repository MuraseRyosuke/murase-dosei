name: Fetch Social Activities

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Run every 30 minutes

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push timeline.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install # package-lock.jsonがなくても動くようにinstallを使用

      - name: Fetch and update timeline
        run: node scripts/fetch_activities.js
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_USER_ID: ${{ secrets.TWITCH_USER_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      
      - name: Generate JST timestamp
        run: echo "NOW=$(TZ=JST-9 date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update timeline data (${{ env.NOW }})"
          file_pattern: timeline.json
