<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murase Dosei - Timeline</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ライトモード用の変数 */
            --bg-color: #f7f9fc;
            --text-color: #333333;
            --timeline-line-color: #cbd5e1;
            --card-bg-color: #ffffff;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --date-color: #64748b;
            --icon-color: #333; /* SNSアイコンのデフォルト色 */
            --icon-bg-color: #e2e8f0;
            --icon-hover-bg: #cbd5e1;
            --link-color: #2563eb;
            --scrollbar-thumb: #cbd5e1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* ダークモード用の変数 */
                --bg-color: #0f172a;
                --text-color: #e2e8f0;
                --timeline-line-color: #334155;
                --card-bg-color: #1e293b;
                --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
                --date-color: #94a3b8;
                --icon-color: #e2e8f0; /* SNSアイコンのデフォルト色 */
                --icon-bg-color: #334155;
                --icon-hover-bg: #475569;
                --link-color: #60a5fa;
                --scrollbar-thumb: #475569;
            }
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: linear-gradient(to bottom, var(--bg-color) 80%, transparent);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
        }

        /* カスタムスクロールバー (Webkit) */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }

        /* --- 横スクロールするアイコンバー (ハイブリッド実装) --- */
        .icon-bar-container {
            width: 100%;
            overflow: hidden; /* コンテナ全体ははみ出しを隠す */
            position: relative;
            padding: 10px 0;
        }

        .icon-bar-scroll-area {
            display: flex;
            overflow-x: auto; /* 手動スクロールを許可 */
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Firefox用 スクロールバー非表示 */
            -ms-overflow-style: none;  /* IE/Edge用 スクロールバー非表示 */
            /* iOSでのスムーズなスクロール */
            -webkit-overflow-scrolling: touch; 
        }
        
        .icon-bar-scroll-area::-webkit-scrollbar {
            display: none; /* Chrome/Safari用 スクロールバー非表示 */
        }

        .icon-track {
            display: flex;
            gap: 20px;
            padding: 0 20px;
            /* JavaScriptで自動スクロールするためのクラス */
            transition: transform 0.1s linear; 
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            min-width: 60px;
            scroll-snap-align: center;
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--icon-bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
            transition: background-color 0.2s, transform 0.2s;
            color: var(--icon-color);
        }

        .icon-circle svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .icon-item:hover .icon-circle {
            background-color: var(--icon-hover-bg);
            transform: translateY(-2px);
        }

        .icon-name {
            font-size: 0.7rem;
            font-weight: bold;
            opacity: 0.8;
        }

        /* 各ブランド固有のホバー色 */
        .icon-item[data-platform="GitHub"]:hover .icon-circle { background-color: #333; color: #fff; }
        .icon-item[data-platform="YouTube"]:hover .icon-circle { background-color: #FF0000; color: #fff; }
        .icon-item[data-platform="Note"]:hover .icon-circle { background-color: #41C9B4; color: #fff; }
        .icon-item[data-platform="X"]:hover .icon-circle { background-color: #000; color: #fff; }
        .icon-item[data-platform="Instagram"]:hover .icon-circle { background-color: #E1306C; color: #fff; }
        .icon-item[data-platform="Bluesky"]:hover .icon-circle { background-color: #0085ff; color: #fff; }
        .icon-item[data-platform="Spotify"]:hover .icon-circle { background-color: #1DB954; color: #fff; }
        .icon-item[data-platform="Tumblr"]:hover .icon-circle { background-color: #36465D; color: #fff; }
        .icon-item[data-platform="Twitch"]:hover .icon-circle { background-color: #9146FF; color: #fff; }
        .icon-item[data-platform="LINE"]:hover .icon-circle { background-color: #06C755; color: #fff; }
        .icon-item[data-platform="Facebook"]:hover .icon-circle { background-color: #1877F2; color: #fff; }
        .icon-item[data-platform="Threads"]:hover .icon-circle { background-color: #000; color: #fff; }
        .icon-item[data-platform="TikTok"]:hover .icon-circle { background-color: #000; color: #fff; }
        .icon-item[data-platform="Vimeo"]:hover .icon-circle { background-color: #1AB7EA; color: #fff; }
        .icon-item[data-platform="Pinterest"]:hover .icon-circle { background-color: #E60023; color: #fff; }
        .icon-item[data-platform="SoundCloud"]:hover .icon-circle { background-color: #FF3300; color: #fff; }
        .icon-item[data-platform="Mixcloud"]:hover .icon-circle { background-color: #5000ff; color: #fff; }
        .icon-item[data-platform="Bandcamp"]:hover .icon-circle { background-color: #629aa9; color: #fff; }
        .icon-item[data-platform="Steam"]:hover .icon-circle { background-color: #00adee; color: #fff; }
        .icon-item[data-platform="BeReal"]:hover .icon-circle { background-color: #000; color: #fff; }
        .icon-item[data-platform="VRChat"]:hover .icon-circle { background-color: #490089; color: #fff; }
        .icon-item[data-platform="Pixiv"]:hover .icon-circle { background-color: #0096fa; color: #fff; }
        .icon-item[data-platform="Niconico"]:hover .icon-circle { background-color: #252525; color: #fff; }

        @media (prefers-color-scheme: dark) {
            .icon-item[data-platform="GitHub"]:hover .icon-circle { background-color: #ffffff; color: #000; }
            .icon-item[data-platform="X"]:hover .icon-circle { background-color: #ffffff; color: #000; }
            .icon-item[data-platform="Threads"]:hover .icon-circle { background-color: #ffffff; color: #000; }
            .icon-item[data-platform="TikTok"]:hover .icon-circle { background-color: #ffffff; color: #000; }
            .icon-item[data-platform="BeReal"]:hover .icon-circle { background-color: #ffffff; color: #000; }
            .icon-item[data-platform="Niconico"]:hover .icon-circle { background-color: #ffffff; color: #000; }
        }

        /* --- 縦のタイムライン --- */
        main {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
            list-style: none;
            margin: 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 9px;
            width: 2px;
            background-color: var(--timeline-line-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 30px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -30px;
            top: 6px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--link-color);
            border: 3px solid var(--bg-color);
            z-index: 10;
        }

        .timeline-content {
            background-color: var(--card-bg-color);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .timeline-content:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        @media (prefers-color-scheme: dark) {
             .timeline-content:hover {
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
            }
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .platform-name {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .platform-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .date {
            color: var(--date-color);
        }

        .activity-text {
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
            word-break: break-word;
        }

        .activity-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .loading, .error-message {
            text-align: center;
            padding: 40px;
            color: var(--date-color);
        }

        footer {
            padding: 30px 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--date-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Murase Dosei</h1>
        <div class="icon-bar-container">
            <div class="icon-bar-scroll-area" id="scrollArea">
                <div class="icon-track" id="iconTrack">
                    <!-- JavaScriptでアイコンが生成されます -->
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="status" class="loading">活動履歴を読み込み中...</div>
        <ul class="timeline" id="timeline">
            <!-- JavaScriptでタイムラインが生成されます -->
        </ul>
    </main>

    <footer>
        &copy; 2026 Ryosuke Murase
    </footer>

        ];

        // --- アイコンバーの生成 ---
        const iconTrack = document.getElementById('iconTrack');
        const scrollArea = document.getElementById('scrollArea');

        // 手動スクロールと無限スクロールを両立させるため、要素を複製
        function renderIcons() {
            let html = '';
            socialLinks.forEach(link => {
                const iconSvg = ICONS[link.name] || '';
                html += `
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="icon-item" data-platform="${link.name}">
                        <div class="icon-circle">${iconSvg}</div>
                        <span class="icon-name">${link.name}</span>
                    </a>
                `;
            });
            // 無限スクロールっぽく見せるために3セット繋げる
            iconTrack.innerHTML = html + html + html;
        }

        renderIcons();

        // アイコンバーのアニメーション制御 (JavaScriptによる手動/自動のハイブリッド)
        let scrollPos = 0;
        let isHovering = false;
        let isDragging = false; // スマホでのタッチやスワイプ中
        let animationFrameId;

        function updateScroll() {
            if (!isHovering && !isDragging) {
                // 自動スクロール
                scrollArea.scrollLeft += 0.5; // スピード
                
                // 真ん中のセットを超えたら、最初のセットの同じ位置に瞬時に戻す（ループ）
                const singleSetWidth = iconTrack.scrollWidth / 3;
                if (scrollArea.scrollLeft >= singleSetWidth * 2) {
                    scrollArea.scrollLeft -= singleSetWidth;
                }
            }
            animationFrameId = requestAnimationFrame(updateScroll);
        }

        // 初期位置を真ん中のセットの先頭（空白回避）に設定し、アニメーション開始
        window.addEventListener('load', () => {
            scrollArea.scrollLeft = iconTrack.scrollWidth / 3;
            animationFrameId = requestAnimationFrame(updateScroll);
        });

        // マウスホバーとタッチで自動スクロールを一時停止
        scrollArea.addEventListener('mouseenter', () => isHovering = true);
        scrollArea.addEventListener('mouseleave', () => isHovering = false);
        scrollArea.addEventListener('touchstart', () => isDragging = true, {passive: true});
        scrollArea.addEventListener('touchend', () => isDragging = false);

        // --- タイムラインの生成 ---
        const timelineEl = document.getElementById('timeline');
        const statusEl = document.getElementById('status');

        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('ja-JP', { 
                month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' 
            });
        }

        function createTimelineItem(activity) {
            const li = document.createElement('li');
            li.className = 'timeline-item';
            
            const iconSvg = ICONS[activity.platform] || '';
            
            li.innerHTML = `
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <div class="timeline-header">
                        <span class="platform-name">
                            <span class="platform-icon">${iconSvg}</span>
                            ${activity.platform}
                        </span>
                        <span class="date">${formatDate(activity.timestamp)}</span>
                    </div>
                    <a href="${activity.url}" target="_blank" rel="noopener noreferrer" class="activity-link">
                        <p class="activity-text">${activity.content}</p>
                    </a>
                </div>
            `;
            return li;
        }

        async function fetchTimeline() {
            try {
                // GitHub Pagesのルートディレクトリにある timeline.json を取得
                const response = await fetch('timeline.json');
                if (!response.ok) {
                    throw new Error('データの読み込みに失敗しました');
                }
                const activities = await response.json();
                
                statusEl.style.display = 'none';
                
                if (activities.length === 0) {
                    timelineEl.innerHTML = '<li class="loading">最近の活動はありません</li>';
                    return;
                }

                activities.forEach(activity => {
                    timelineEl.appendChild(createTimelineItem(activity));
                });
                
            } catch (error) {
                console.error(error);
                statusEl.className = 'error-message';
                statusEl.textContent = '活動履歴の読み込みに失敗しました。';
            }
        }

        // ページ読み込み時にタイムラインを取得
        fetchTimeline();
    </script>
